[project]
name = "flowcargaapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.3.7",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # Erros pycodestyle
    "F",   # Pyflakes
    "I",   # Ordenação de imports
    "UP",  # Atualizações de sintaxe Python
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"